name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build 🔧
        run: |
          echo "Starting install and build..." > build.log
          npm install --legacy-peer-deps >> build.log 2>&1
          echo "Starting production build..." >> build.log
          npm run build >> build.log 2>&1

      - name: Commit build log on failure 📝
        if: failure()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add build.log
          git commit -m "chore: add build log from failed run [skip ci]"
          git push origin main

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
